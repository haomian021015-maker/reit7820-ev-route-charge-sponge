# Four services from one image. The three agents are genuinely separate servers
# that do not import each other; the console reaches them over HTTP by name, the
# same way the Showcase Orchestrator will.
#
#   docker compose -f docker/compose.yml up --build
#   open http://localhost:8080
#
# You only need the one for your own domain. Start it alone with:
#
#   docker compose -f docker/compose.yml up charging

name: smac

x-agent: &agent
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &keys
    # Your agent runs on the Claude API. With no key set the tools still return
    # their computed facts; only the written commentary is skipped.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    # Only needed for `run_eval.py --wandb`. Your own key, your own project.
    WANDB_API_KEY: ${WANDB_API_KEY:-}
    WANDB_PROJECT: ${WANDB_PROJECT:-}
    WANDB_ENTITY: ${WANDB_ENTITY:-}
  volumes:
    # Keeps the 28 MB GTFS download and the geocoding cache across restarts.
    - cache:/app/src/.cache

x-probe: &probe
  test: ["CMD", "python", "-c", "import socket,os;socket.create_connection(('127.0.0.1',int(os.environ['PORT'])),2).close()"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  charging:
    <<: *agent
    command: python /app/src/agents/charging.py
    ports: ["8000:8000"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8000"

  public_transport:
    <<: *agent
    command: python /app/src/agents/public_transport.py
    ports: ["8001:8001"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8001"

  policy:
    <<: *agent
    command: python /app/src/agents/policy.py
    ports: ["8002:8002"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8002"

  console:
    <<: *agent
    command: python /app/application/ui.py
    ports: ["8080:8080"]
    environment:
      <<: *keys
      PORT: "8080"
      CHARGING_URL: http://charging:8000/mcp
      PT_URL: http://public_transport:8001/mcp
      POLICY_URL: http://policy:8002/mcp
    # Wait until each agent answers, so the console never opens showing three
    # offline agents.
    depends_on:
      charging: {condition: service_healthy}
      public_transport: {condition: service_healthy}
      policy: {condition: service_healthy}

volumes:
  cache:
