[project]
name = "smac-agent"
version = "0.1.0"
description = "REIT7820 Smart Mobility Agent Collective - student agent"
requires-python = ">=3.10"

dependencies = [
    # Pinned on purpose. mcp 2.x is the only line that speaks MCP protocol
    # revision 2025-11-25, which this course requires (spec §2, decision D6).
    # The previous line (1.9.x) tops out at 2025-03-26 and cannot be used.
    # Do not run `pip install -U mcp` during semester.
    "mcp>=2.0.0,<3",
    "httpx>=0.27",
    # Only needed for `run_eval.py --wandb`. Everything else runs without it.
    "wandb>=0.18",
]


[tool.uv]
package = false

